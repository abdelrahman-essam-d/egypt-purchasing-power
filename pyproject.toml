[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purchasing-power"
version = "0.1.0"
description = "Egypt purchasing power tracker: real wages, FX and honest forecasting"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "duckdb",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100